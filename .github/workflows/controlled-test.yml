name: Controlled Telegram Test

on:
  workflow_dispatch:
    inputs:
      destination:
        description: 'Where to send the single controlled test'
        required: true
        default: 'group'
        type: choice
        options:
          - group
          - channel

permissions:
  contents: read

concurrency:
  group: cryptoaid-controlled-test
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Send exactly one test message
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_GROUP: '@cryptoAIDsupporter'
          TELEGRAM_CHANNEL: '@cryptoaidsup'
        run: python bot/publisher.py --destination "${{ inputs.destination }}" --message test --live
