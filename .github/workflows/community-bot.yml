name: Community Bot
on:
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'
permissions:
  contents: read
concurrency:
  group: cryptoaid-community-bot
  cancel-in-progress: true
jobs:
  community:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Serve Telegram updates safely for this window
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_GROUP: '@cryptoAIDsupporter'
          TELEGRAM_CHANNEL: '@cryptoaidsup'
        run: timeout 8m python bot/main.py || code=$?; if [ "${code:-0}" = "124" ]; then exit 0; else exit "${code:-0}"; fi
