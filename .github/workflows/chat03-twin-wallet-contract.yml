name: CHAT03 Twin Wallet Contract
on:
  pull_request:
    paths:
      - 'twin/**'
      - 'tests/test_twin_engine.py'
      - '.github/workflows/chat03-twin-wallet-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  twin-wallet-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile CHAT03 read model
        run: python -m compileall twin
      - name: Run deterministic CHAT03 tests
        run: python -m pytest -q tests/test_twin_engine.py
      - name: Enforce no wallet secrets or custody primitives
        shell: bash
        run: |
          ! grep -R -E '(seed phrase value|mnemonic value|private[_ -]?key value|eth_sendRawTransaction)' twin tests/test_twin_engine.py
