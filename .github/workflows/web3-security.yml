name: Web3 Security
on:
  push:
    paths: ['web3/**','.github/workflows/web3-security.yml','scripts/check_mvp_authority.py','tests/test_mvp_authority_guard.py']
  pull_request:
    paths: ['web3/**','scripts/check_mvp_authority.py','tests/test_mvp_authority_guard.py']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile-test-package:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run compile
      - run: npm test -- --no-compile
      - run: npm run deploy:bundle
      - name: Verify 48H MVP Case-payment authority quarantine in generated bundle
        run: |
          set -euo pipefail
          python3 ../scripts/check_mvp_authority.py deploy/deployment-plan.json --deployer deploy/index.html --exporter scripts/export-deploy-bundle.js --bundle deploy/deploy-bundle.json
          ! grep -q '"name": "CryptoAIDCasePayment"' deploy/deploy-bundle.json
      - name: Build offline deploy package
        run: |
          test -f node_modules/ethers/dist/ethers.umd.min.js
          cp node_modules/ethers/dist/ethers.umd.min.js deploy/ethers.umd.min.js
          test -f deploy/index.html
          test -f deploy/deploy-bundle.json
          test -f deploy/deployment-plan.json
          test -f deploy/README-OFFLINE-DEPLOY.md
          grep -q './ethers.umd.min.js' deploy/index.html
          grep -q '"chainId":137' deploy/deployment-plan.json
          (cd deploy && sha256sum index.html ethers.umd.min.js deploy-bundle.json deployment-plan.json > checksums.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: cryptoaid-polygon-mainnet-offline-deployer
          path: |
            web3/deploy/index.html
            web3/deploy/ethers.umd.min.js
            web3/deploy/deploy-bundle.json
            web3/deploy/deployment-plan.json
            web3/deploy/README-OFFLINE-DEPLOY.md
            web3/deploy/checksums.sha256
          if-no-files-found: error
  slither:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install slither-analyzer==0.11.6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: cd web3 && npm install --no-audit --no-fund && npx hardhat compile
      - name: Slither report
        run: |
          cd web3
          set +e
          slither . --exclude-dependencies --json slither-report.json
          code=$?
          echo "Slither exit code: $code"
          test -f slither-report.json
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: cryptoaid-slither-report
          path: web3/slither-report.json
          if-no-files-found: error
