name: Web3 Security
on:
  push:
    paths: ['web3/**','.github/workflows/web3-security.yml']
  pull_request:
    paths: ['web3/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile-test-bundle:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web3/package-lock.json
      - run: npm ci
      - run: npm run compile
      - run: npm test -- --no-compile
      - run: npm run deploy:bundle
      - uses: actions/upload-artifact@v4
        with:
          name: cryptoaid-mainnet-deploy-bundle
          path: web3/deploy/deploy-bundle.json
          if-no-files-found: error
  slither:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install slither-analyzer==0.11.6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web3/package-lock.json
      - run: cd web3 && npm ci && npx hardhat compile
      - run: cd web3 && slither . --exclude-dependencies
