name: Web3 Security
on:
  push:
    paths: ['web3/**','.github/workflows/web3-security.yml']
  pull_request:
    paths: ['web3/**']
  workflow_dispatch:
jobs:
  compile-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web3/package-lock.json
      - run: npm install
      - run: npm run compile
      - run: npm test -- --no-compile
  slither:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install slither-analyzer
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: cd web3 && npm install && npx hardhat compile
      - run: cd web3 && slither . --exclude-dependencies
