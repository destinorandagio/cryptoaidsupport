name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Compile runtime Python
        run: python -m compileall bot core twin evidence_payment runtime
      - name: Run pytest with diagnostic artifact
        run: pytest -q --junitxml="$RUNNER_TEMP/pytest-results.xml"
      - name: Upload pytest failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-failure-${{ github.sha }}
          path: ${{ runner.temp }}/pytest-results.xml
          if-no-files-found: warn
          retention-days: 2
      - name: Fail closed on parallel MVP Case-payment authority, manifest leakage and deployer bypass
        run: python scripts/check_mvp_authority.py web3/deploy/deployment-plan.json --manifest web3/deploy/polygon-mainnet-manifest.json --deployer web3/deploy/index.html --exporter web3/scripts/export-deploy-bundle.js
      - name: Verify GitHub runner MVP PHP baseline
        shell: bash
        run: |
          set -euo pipefail
          php -v
          php -r '$required=["PDO","pdo_sqlite","curl","fileinfo","openssl","json"]; $loaded=array_map("strtolower",get_loaded_extensions()); $missing=[]; foreach($required as $ext){if(!in_array(strtolower($ext),$loaded,true)){$missing[]=$ext;}} echo json_encode(["required"=>$required,"missing"=>$missing],JSON_PRETTY_PRINT),PHP_EOL; if($missing){exit(2);} $db=new PDO("sqlite::memory:"); echo "pdo_sqlite_memory=PASS sqlite_version=".$db->query("select sqlite_version()") ->fetchColumn().PHP_EOL;'
      - name: Staging PWA shell package and restore smoke (not final deploy package)
        shell: bash
        run: |
          set -euo pipefail
          python scripts/mvp_release_candidate.py frontend/public_html \
            --package "$RUNNER_TEMP/cryptoaid-pwa-shell.zip" \
            --manifest "$RUNNER_TEMP/cryptoaid-pwa-shell-manifest.json" \
            --restore-check
      - name: Ensure no obvious Telegram token committed
        run: '! grep -R -E "[0-9]{8,12}:[A-Za-z0-9_-]{30,}" --exclude-dir=.git .'
